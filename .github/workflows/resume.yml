name: resume

"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: "The Dark Factory run id to resume"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dark-factory
        run: pip install "dark-factory @ git+https://github.com/mariakravchenko/dark-factory.git"

      - name: Resume the run
        run: dark-factory resume "${{ inputs.run_id }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

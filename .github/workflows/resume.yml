name: resume

"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: "The Dark Factory run id to resume"
        required: true
        type: string
      answer:
        description: "Answer to the run's open human question (omit to just re-drive)"
        required: false
        type: string

# contents: push each role's work back to origin. issues: post the
# clarification comment when a run pauses WAITING_HUMAN. pull-requests:
# open the PR after QA PASS and Quality Gate PASS.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dark-factory
        run: pip install "dark-factory @ git+https://github.com/mariakravchenko/dark-factory.git"

      - name: Install the worker runtime (claude-code)
        run: npm install -g @anthropic-ai/claude-code

      - name: Resume the run
        run: |
          if [ -n "$RUN_ANSWER" ]; then
            dark-factory resume "$RUN_ID" --answer "$RUN_ANSWER"
          else
            dark-factory resume "$RUN_ID"
          fi
        env:
          RUN_ID: ${{ inputs.run_id }}
          RUN_ANSWER: ${{ inputs.answer }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # The reserved Actions auto-token (secrets.GITHUB_TOKEN) can never
          # call GET /user ("Resource not accessible by integration", 403
          # regardless of the permissions: block above) -- a hard GitHub
          # platform rule for installation tokens, not a scoping gap. Dark
          # Factory's own authenticated_login() self-heal check (crash-resume
          # dedup before posting a clarification comment) needs a real PAT.
          DARK_FACTORY_GITHUB_TOKEN: ${{ secrets.DARK_FACTORY_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: run

"on":
  workflow_dispatch:
    inputs:
      source:
        description: "The source to run: a text: string, a spec: file path, or a github: issue number"
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dark-factory
        run: pip install "dark-factory @ git+https://github.com/mariakravchenko/dark-factory.git"

      - name: Install the worker runtime (claude-code)
        run: npm install -g @anthropic-ai/claude-code

      - name: Start the run
        run: dark-factory run "${{ inputs.source }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: run

"on":
  workflow_dispatch:
    inputs:
      source:
        description: "The source to run: a text: string, a spec: file path, or a github: issue number"
        required: true
        type: string

# contents: push each role's work back to origin. issues: post the
# clarification comment when a run pauses WAITING_HUMAN. pull-requests:
# open the PR after QA PASS and Quality Gate PASS.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dark-factory
        run: pip install "dark-factory @ git+https://github.com/mariakravchenko/dark-factory.git"

      - name: Install the worker runtime (claude-code)
        run: npm install -g @anthropic-ai/claude-code

      - name: Start the run
        run: dark-factory run "${{ inputs.source }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # The reserved Actions auto-token (secrets.GITHUB_TOKEN) can never
          # call GET /user ("Resource not accessible by integration", 403
          # regardless of the permissions: block above) -- a hard GitHub
          # platform rule for installation tokens, not a scoping gap. Dark
          # Factory's own authenticated_login() self-heal check (crash-resume
          # dedup before posting a clarification comment) needs a real PAT.
          # dark-factory itself now reads this under DARK_FACTORY_GITHUB_TOKEN
          # (renamed upstream to avoid colliding with GitHub's own reserved name).
          DARK_FACTORY_GITHUB_TOKEN: ${{ secrets.DISPATCH_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
